<!DOCTYPE html>
<html lang="{{ site.lang }}">
  <head>
    {% if page.redirect %}<meta http-equiv="refresh" content="3; url={{ '/' | relative_url }}">{% endif %}
    {% include head.html %}
  </head>
  <body class="fixed-top-nav sticky-bottom-footer">
    {% include header.html %}
    <main class="container mt-5">{{ content }}</main>
    {% include footer.html %}

    <script src="https://cdn.jsdelivr.net/npm/jquery@{{ site.jquery.version }}/dist/jquery.min.js" integrity="{{ site.jquery.integrity }}" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@{{ site.bootstrap.version }}/dist/js/bootstrap.bundle.min.js" integrity="{{ site.bootstrap.integrity.js }}" crossorigin="anonymous"></script>
    <script>
      (() => {
        const progress = document.getElementById("progress");
        const updateProgress = () => {
          const navbarHeight = document.getElementById("navbar").offsetHeight;
          const maximum = Math.max(document.documentElement.scrollHeight - window.innerHeight, 1);
          document.body.style.paddingTop = `${navbarHeight}px`;
          progress.style.top = `${navbarHeight}px`;
          progress.max = maximum;
          progress.value = Math.min(window.scrollY, maximum);
        };
        updateProgress();
        document.addEventListener("scroll", updateProgress, { passive: true });
        window.addEventListener("resize", updateProgress);
      })();
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag("js", new Date());
      gtag("config", "{{ site.google_analytics }}");
    </script>
  </body>
</html>
