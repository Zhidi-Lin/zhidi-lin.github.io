<header>
  <nav id="navbar" class="navbar navbar-light navbar-expand-sm fixed-top">
    <div class="container">
      {% if page.permalink == '/' %}
        <div class="navbar-brand social">{% include social.html %}</div>
      {% else %}
        <a class="navbar-brand title font-weight-lighter" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      {% endif %}

      <button class="navbar-toggler collapsed ml-auto" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="sr-only">Toggle navigation</span>
        <span class="icon-bar top-bar"></span>
        <span class="icon-bar middle-bar"></span>
        <span class="icon-bar bottom-bar"></span>
      </button>

      <div class="collapse navbar-collapse text-right" id="navbarNav">
        <ul class="navbar-nav ml-auto flex-nowrap">
          <li class="nav-item {% if page.permalink == '/' %}active{% endif %}">
            <a class="nav-link" href="{{ '/' | relative_url }}">About</a>
          </li>
          {% assign sorted_pages = site.pages | sort: "nav_order" %}
          {% for nav_page in sorted_pages %}
            {% if nav_page.nav %}
              <li class="nav-item {% if page.title == nav_page.title %}active{% endif %}">
                <a class="nav-link" href="{{ nav_page.url | relative_url }}">{{ nav_page.title }}</a>
              </li>
            {% endif %}
          {% endfor %}
          <li class="toggle-container">
            <button id="light-toggle" title="Change theme" aria-label="Change theme">
              <i class="fas fa-moon"></i>
              <i class="fas fa-sun"></i>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <progress id="progress" value="0"><span class="progress-bar"></span></progress>
</header>
