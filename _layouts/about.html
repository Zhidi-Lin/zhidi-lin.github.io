---
layout: default
---
<div class="post">
  <header class="post-header">
    <h1 class="post-title">{{ site.title }}</h1>
  </header>
  <article>
    <div class="profile float-right">
      <img src="{{ page.profile_image | prepend: '/assets/img/' | relative_url }}" class="img-fluid" alt="{{ site.title }}">
    </div>
    <div class="clearfix">{{ content }}</div>
    <div class="social">
      <div class="contact-icons">{% include social.html %}</div>
    </div>
  </article>
</div>
